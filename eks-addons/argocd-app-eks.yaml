apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-platform-eks
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shivam535353/production-grade-devops-platform.git
    targetRevision: main
    path: helm/devops-platform
    helm:
      releaseName: devops-platform
      valueFiles:
        - values-eks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
