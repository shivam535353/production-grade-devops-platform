# =============================================================================
# Development Environment Overrides (Minikube)
# =============================================================================

namespace: dev

image:
  repository: ghcr.io/shivam535353/production-grade-devops-platform
  tag: "sha-1c661b2"
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: null
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60

ingress:
  enabled: false

configMap:
  data:
    APP_ENV: "development"
    LOG_LEVEL: "debug"
    CLOUD_PLATFORM: "Minikube"
    GITOPS_ENABLED: "true"        # ← line add
    DEMO_VERSION: "section-8"
    FEATURE_FLAG_NEW_UI: "true"

secret:
  enabled: false
  secretKey: "local-dev-secret-12345"

serviceMonitor:
  enabled: true

grafanaDashboard:
  enabled: true

prometheusRule:
  enabled: true
  testAlert: false

# NetworkPolicy — Development
networkPolicy:
  enabled: true


# Phase 8 - Step 2: DEV runtime hardening
serviceAccount:
  automount: false

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi

volumeMounts:
  - name: tmp
    mountPath: /tmp
