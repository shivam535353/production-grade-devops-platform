{{- if and .Values.secret.enabled (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-platform.fullname" . }}-secret
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    {{- include "devops-platform.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ required "Set secret.existingSecret, or pass --set secret.secretKey=..." .Values.secret.secretKey | b64enc | quote }}
{{- end }}