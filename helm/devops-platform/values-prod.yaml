# =============================================================================
# Production Environment Overrides (AWS EKS)
# =============================================================================

namespace: production

image:
  repository: production-grade-devops-platform
  tag: "v1"
  pullPolicy: Never

replicaCount: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: false
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
  hosts:
    - host: devops-platform.example.com
      paths:
        - path: /
          pathType: Prefix

configMap:
  data:
    APP_ENV: "production"
    LOG_LEVEL: "info"
    CLOUD_PLATFORM: "AWS EKS"

secret:
  secretKey: "CHANGE_ME_IN_CI_CD_PIPELINE"   # Real value injected via GitHub Secrets / AWS Secrets Manager