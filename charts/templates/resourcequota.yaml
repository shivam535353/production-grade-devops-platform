apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Release.Name }}-quota
  namespace: {{ .Release.Namespace }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.requestsCpu | default "2" }}
    requests.memory: {{ .Values.quota.requestsMemory | default "4Gi" }}
    limits.cpu: {{ .Values.quota.limitsCpu | default "4" }}
    limits.memory: {{ .Values.quota.limitsMemory | default "8Gi" }}
    pods: {{ .Values.quota.maxPods | default "20" }}