apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  placeholder: "notifications-disabled"
  # NOTE: Triggers correctly detect events (verified in logs)
  # Delivery requires external service (Slack/Email) — configured in production
  # Local demo: triggers only, no delivery service

  trigger.on-sync-succeeded: |
    - description: Application synced successfully
      send:
        - app-sync-succeeded
      when: app.status.operationState.phase in ['Succeeded']

  trigger.on-sync-failed: |
    - description: Application sync failed
      send:
        - app-sync-failed
      when: app.status.operationState.phase in ['Error', 'Failed']

  trigger.on-health-degraded: |
    - description: Application health degraded
      send:
        - app-health-degraded
      when: app.status.health.status == 'Degraded'

  trigger.on-deployed: |
    - description: Application deployed successfully
      send:
        - app-deployed
      when: app.status.operationState.phase in ['Succeeded'] && app.status.health.status == 'Healthy'

  template.app-sync-succeeded: |
    message: |
      ✅ {{.app.metadata.name}} synced | env: {{.app.metadata.labels.environment}}

  template.app-sync-failed: |
    message: |
      ❌ {{.app.metadata.name}} sync FAILED | {{.app.status.operationState.message}}

  template.app-health-degraded: |
    message: |
      ⚠️ {{.app.metadata.name}} health DEGRADED

  template.app-deployed: |
    message: |
      🚀 {{.app.metadata.name}} deployed! Revision: {{.app.status.sync.revision}}