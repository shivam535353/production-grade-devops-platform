# =============================================================================
# production-grade-devops-platform — GitHub Actions CI/CD Pipeline
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Workflow-level permissions (least privilege)
permissions:
  contents: write
  packages: write
  id-token: write

# Global environment variables
env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: test — Lint, format, endpoint validation
  # ---------------------------------------------------------------------------
  test:
    name: "🧪 Lint & Test"
    runs-on: ubuntu-latest

    steps:

      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "⬇️ Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: "🔍 Lint with flake8"
        run: |
          flake8 . \
            --count \
            --max-line-length=120 \
            --exclude=.git,__pycache__,.venv,venv \
            --statistics

      - name: "🎨 Format check with black"
        run: |
          black --check --diff --line-length 120 .

      - name: "✅ Verify Flask endpoints"
        env:
          APP_ENV: testing
          SECRET_KEY: ci-test-secret-key
        run: |
          python -c "
          from app import create_app
          app = create_app('testing')
          with app.test_client() as c:
              for ep in ['/', '/health', '/info', '/version', '/metrics', '/tech-stack', '/developer']:
                  r = c.get(ep)
                  assert r.status_code == 200, f'FAILED {ep}: {r.status_code}'
                  print(f'PASS {ep}')
          print('All endpoints healthy.')
          "

  # ---------------------------------------------------------------------------
  # JOB 2: security — Trivy vulnerability scan
  # ---------------------------------------------------------------------------
  security:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🛠️ Install Trivy"
        run: |
          sudo apt-get install wget apt-transport-https gnupg -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install trivy -y

      - name: "🛡️ Run Trivy filesystem scan"
        run: |
          trivy fs . \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            --format table
          echo "Trivy scan complete — no CRITICAL vulnerabilities found!"

  # ---------------------------------------------------------------------------
  # JOB 3: build-push — Docker build + GHCR push (main branch only)
  # ---------------------------------------------------------------------------
  build-push:
    name: "🐳 Build & Push Image"
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'

    steps:

      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🔑 Log in to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "⚙️ Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🏗️ Build and push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "✅ Image pushed successfully"
        run: |
          echo "Image: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "Image: ${{ env.IMAGE_NAME }}:latest"

      - name: Done
        run: echo "Image pushed successfully!"
