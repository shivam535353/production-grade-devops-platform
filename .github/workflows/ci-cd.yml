# =============================================================================
# production-grade-devops-platform — GitHub Actions CI/CD Pipeline
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Workflow-level permissions (least privilege)
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Global environment variables
env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: test — Lint, format, endpoint validation
  # ---------------------------------------------------------------------------
  test:
    name: "🧪 Lint & Test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: "🐍 Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "⬇️ Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black
      - name: "🔍 Lint with flake8"
        run: |
          flake8 . \
            --count \
            --max-line-length=120 \
            --exclude=.git,__pycache__,.venv,venv \
            --statistics
      - name: "🎨 Format check with black"
        run: |
          black --check --diff --line-length 120 .
      - name: "✅ Verify Flask endpoints"
        env:
          APP_ENV: testing
          SECRET_KEY: ci-test-secret-key
        run: |
          python -c "
          from app import create_app
          app = create_app('testing')
          with app.test_client() as c:
              for ep in ['/', '/health', '/info', '/version', '/metrics', '/tech-stack', '/developer']:
                  r = c.get(ep)
                  assert r.status_code == 200, f'FAILED {ep}: {r.status_code}'
                  print(f'PASS {ep}')
          print('All endpoints healthy.')
          "
  # ---------------------------------------------------------------------------
  # JOB 2: security — Trivy vulnerability scan
  # ---------------------------------------------------------------------------
  security:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:

      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: "🛠️ Install Trivy"
        run: |
          sudo apt-get install wget apt-transport-https gnupg -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install trivy -y
      - name: "🛡️ Run Trivy filesystem scan"
        run: |
          trivy fs . \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            --format table
          echo "Trivy scan complete — no CRITICAL vulnerabilities found!"
  # ---------------------------------------------------------------------------
  # JOB 3: build-push — SECTION 6 + 7
  # Docker build with production tags + GHCR push
  # ---------------------------------------------------------------------------
  build-push:
    name: "🐳 Build & Push Image"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    needs: [test, security]
    # Both test and security jobs must pass before this job runs

    # Job-level outputs — passes image tag to the next job
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:

      # STEP 1: Checkout code from repository onto the runner
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # STEP 2: Set up Docker Buildx
      # Enables advanced build engine with:
      # - Multi-platform support (linux/amd64 + linux/arm64)
      # - GitHub Actions cache backend support
      # - Parallel layer building for faster builds
      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # STEP 3: Authenticate to GitHub Container Registry (GHCR)
      # github.actor  = username of whoever triggered the workflow
      # GITHUB_TOKEN  = automatically injected by GitHub Actions, no manual setup needed
      # Token scope   = write access only to this repo's packages (least privilege)
      - name: "🔑 Log in to GitHub Container Registry"
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STEP 4: Generate Docker image tags and OCI labels
      # Produces 4 tags per build:
      #   :latest              → always points to the newest main branch build
      #   :sha-abc1234         → short 7-char git SHA, immutable, used for production deploys
      #   :main-20240717-143022 → branch + timestamp, useful for chronological tracking
      #   :pr-42               → auto-generated for pull request builds, cleaned up after merge
      # Also embeds OCI-standard metadata labels into the image
      - name: "🏷️ Extract Docker metadata"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Tag 1: latest — only on default branch (main)
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag 2: short SHA — immutable, production deployment standard
            type=sha,prefix=sha-,format=short
            # Tag 3: branch + date + time — chronological build tracking
            type=ref,event=branch,suffix=-{{date 'YYYYMMDD-HHmmss'}}
            # Tag 4: PR reference — auto-tagged on pull request builds
            type=ref,event=pr,prefix=pr-
          labels: |
            org.opencontainers.image.title=production-grade-devops-platform
            org.opencontainers.image.description=Multi-Environment CI/CD Platform
            org.opencontainers.image.vendor=Shivam Gadilkar
            org.opencontainers.image.url=https://github.com/shivam535353/production-grade-devops-platform
      # STEP 5: Build the Docker image and push to GHCR
      #
      # push: false on pull_request — image is built (to catch Dockerfile errors)
      #       but NOT pushed, because unreviewed code should not enter the registry
      # push: true on main/develop push — build and push both happen
      #
      # platforms: linux/amd64 — matches AWS EKS node architecture (x86_64)
      #
      # cache-from/cache-to: type=gha
      #   Uses GitHub Actions cache for Docker layer caching
      #   mode=max caches all intermediate layers
      #   First build: 3-5 min | Cache hit builds: 30-60 sec
      #
      # build-args: GIT_COMMIT
      #   Embeds the exact git commit SHA inside the container at build time
      #   Enables full traceability — you can always tell which commit is running
      - name: "🏗️ Build and push Docker image"
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
      # STEP 6: Write a formatted build summary to the GitHub Actions Summary page
      # $GITHUB_STEP_SUMMARY is a special file provided by GitHub Actions
      # Anything written to it renders as Markdown in the Actions tab → Summary section
      - name: "📋 Image build summary"
        run: |
          echo "## 🐳 Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
  # ---------------------------------------------------------------------------
  # JOB 4: verify-image — SECTION 8
  # Pull image from GHCR and run smoke test + metadata verification
  # ---------------------------------------------------------------------------
  verify-image:
    name: "🔍 Verify Image"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read
    needs: build-push
    if: github.event_name != 'pull_request'
    # Only runs on push events — image must exist in GHCR before we can pull it

    steps:

      # Authenticate to GHCR before pulling the image
      - name: "🔑 Log in to GHCR"
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STEP 1: Pull the image from GHCR and inspect its metadata
      # Verifies the image is accessible, pullable, and not corrupted
      - name: "⬇️ Pull and verify image"
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:latest"
          echo "Pulling: $IMAGE"
          docker pull $IMAGE
          echo ""
          echo "=== Image Details ==="
          docker inspect $IMAGE --format='
          ID:           {{.Id}}
          Created:      {{.Created}}
          Architecture: {{.Architecture}}
          OS:           {{.Os}}
          Size:         {{.Size}} bytes
          '
      # STEP 2: Smoke test — run the container and hit the /health endpoint
      # This is a production pattern called "smoke testing" or "canary check"
      # Confirms the image actually starts, the app boots, and responds correctly
      # If /health returns anything other than 200, the job fails and alerts the team
      - name: "🏥 Test container health endpoint"
        run: |
          docker run -d \
            --name test-container \
            -p 5000:5000 \
            -e APP_ENV=testing \
            -e SECRET_KEY=ci-verify-secret \
            ${{ env.IMAGE_NAME }}:latest
          echo "Waiting for container health..."

          for i in $(seq 1 10); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:5000/health || true)

            echo "Attempt $i/10 - HTTP $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then
            echo "Container health check PASSED"
            exit 0
          fi

            sleep 3
          done

          echo "Container health check FAILED"
          docker logs test-container || true
          docker stop test-container || true
          docker rm test-container || true
          exit 1

      - name: "📋 Collect container logs on failure"
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p failure-logs
          docker logs test-container > failure-logs/container.log 2>&1 || true
          docker ps -a > failure-logs/docker-containers.txt
          docker inspect test-container > failure-logs/container-inspect.json 2>&1 || true
          docker stop test-container || true
          docker rm test-container || true

      - name: "📦 Upload failure diagnostics"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-image-failure-logs
          path: failure-logs/
          if-no-files-found: warn
          retention-days: 7
      # STEP 3: Verify OCI labels are correctly embedded in the image
      # Confirms that title, description, vendor, and source URL
      # were properly injected during the build step
      - name: "🏷️ Verify OCI labels"
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:latest"
          echo "=== OCI Labels ==="
          docker inspect $IMAGE \
            --format='{{json .Config.Labels}}' | \
            python3 -m json.tool
  # ---------------------------------------------------------------------------
  # JOB 5: gitops-update — SECTION 9
  # Update Helm values.yaml with new image tag → triggers ArgoCD auto-sync
  # ---------------------------------------------------------------------------
  gitops-update:
    name: "🔄 GitOps — Update Helm Values"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [build-push, verify-image]
    # Only run on main branch push — not on PRs or develop branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      # STEP 1: Checkout with PAT (not GITHUB_TOKEN)
      # PAT is required because we need to push a commit back to the repo
      # GITHUB_TOKEN cannot trigger subsequent workflow runs (GitHub security limitation)
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
          # fetch-depth: 0 → full git history (needed for accurate git log)

      # STEP 2: Configure Git identity for the automated commit
      - name: "🤖 Configure Git bot identity"
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"
        # Sets the author for the automated commit
        # Shows as "github-actions[bot]" in git history — clearly identifiable

      # STEP 3: Extract the short SHA tag that was built in Job 3
      - name: "🏷️ Extract image tag"
        id: image-tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="sha-${SHORT_SHA}"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag to deploy: ${IMAGE_TAG}"
        # Reconstructs the exact same sha tag that build-push job created
        # github.sha = full 40-char SHA, we take first 7 chars
        # Output: sha-abc1234 (matches docker/metadata-action format)

      # STEP 4: Update values.yaml with new image tag
      - name: "✏️ Update Helm values.yaml"
        run: |
          NEW_TAG="${{ steps.image-tag.outputs.tag }}"
          VALUES_FILE="helm/devops-platform/values-dev.yaml"
          echo "Current image tag in values.yaml:"
          grep "tag:" $VALUES_FILE
          # Use sed to replace the tag line precisely
          sed -i "s/^  tag: .*/  tag: \"${NEW_TAG}\"/" $VALUES_FILE
          echo ""
          echo "Updated image tag in values.yaml:"
          grep "tag:" $VALUES_FILE
        # sed -i → in-place edit (modifies the file directly)
        # Pattern: matches lines starting with "  tag: " (2 spaces — YAML indentation)
        # Replaces entire line with new tag value
        # Precise match prevents accidentally replacing other "tag:" keys

      # STEP 5: Verify the change looks correct before committing
      - name: "🔍 Verify values.yaml change"
        run: |
          echo "=== Git diff of values.yaml ==="
          git diff helm/devops-platform/values-dev.yaml
        # Shows exactly what changed — useful for debugging
        # If diff is empty, the sed pattern didn't match — check YAML indentation

      # STEP 6: Commit and push the updated values.yaml
      - name: "📤 Commit and push Helm values update"
        run: |
          NEW_TAG="${{ steps.image-tag.outputs.tag }}"
          git add helm/devops-platform/values-dev.yaml
          # Check if there are actual changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit - image tag already up to date"
            exit 0
          fi
          git commit -m "chore(gitops): update image tag to ${NEW_TAG} [skip ci]
          Automated update by GitHub Actions CI pipeline
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}
          Triggered by: ${{ github.actor }}
          Commit: ${{ github.sha }}"
          # Retry up to 3 times: rebase on latest remote main, then push.
          # Handles the case where main moved while the pipeline was running.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}..."
            git pull --rebase origin main
            if git push origin main; then
              echo "Push succeeded"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts"
          exit 1
        # git diff --staged --quiet → checks if staging area has changes
        # If no changes (same tag): skip commit (exit 0 = success, not failure)
        # Commit message follows Conventional Commits format (chore: for automation)
        # Multi-line message includes full context for audit trail

      # STEP 7: Post deployment summary
      - name: "📋 Deployment summary"
        run: |
          NEW_TAG="${{ steps.image-tag.outputs.tag }}"
          echo "## 🚀 GitOps Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${NEW_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Full Image | \`${{ env.IMAGE_NAME }}:${NEW_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD | Auto-sync triggered via values.yaml update |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed by | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ArgoCD will detect the Helm values change and deploy automatically." >> $GITHUB_STEP_SUMMARY